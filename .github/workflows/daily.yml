name: Daily leverage dashboard

on:
  schedule:
    # About 1am Pacific, Tuesday to Saturday, so each run picks up the previous
    # trading day's close. GitHub schedules are fixed in UTC, so there is one
    # entry for daylight time and one for standard time; the "check" job below
    # lets only the one that matches the current Pacific clock go ahead.
    - cron: "7 8 * * 2-6"     # 1:07am Pacific daylight time (UTC-7)
    - cron: "7 9 * * 2-6"     # 1:07am Pacific standard time (UTC-8)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # commit the daily readings log
  pages: write              # publish the page
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/Los_Angeles date +%Z)   # PDT or PST right now
          go=true
          if [ "$EVENT" = "schedule" ]; then
            if [ "$CRON" = "7 8 * * 2-6" ] && [ "$zone" != "PDT" ]; then go=false; fi
            if [ "$CRON" = "7 9 * * 2-6" ] && [ "$zone" != "PST" ]; then go=false; fi
          fi
          echo "event=$EVENT cron=$CRON zone=$zone go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the calculations
        run: python -m pytest -q tests

      - name: Build the dashboard
        run: python dashboard.py --out site --history data/history.csv

      - name: Save today's readings and both pages to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv site
          git diff --cached --quiet || git commit -m "Readings for $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
